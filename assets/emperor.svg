<style>
.cw{animation:spin 60s linear infinite;transform-origin:280px 310px}
.ccw{animation:spin 40s linear infinite reverse;transform-origin:280px 310px}
.slow{animation:spin 90s linear infinite;transform-origin:280px 310px}
.crown{animation:float 4s ease-in-out infinite}
.row{animation:fade 1s ease-out both}
.gem{animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fade{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
