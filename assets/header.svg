<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03060c"/><stop offset="1" stop-color="#08141c"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity=".05"/></pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .edge{stroke:#22d3ee;stroke-opacity:.12;stroke-width:1}
  .pulse{stroke:#34d399;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 120;stroke-dashoffset:126;animation:flow 2.8s linear infinite}
  .node{fill:#06101a;stroke:#22d3ee;stroke-width:2;animation:beat 2.4s ease-in-out infinite}
  .scan{animation:scan 6s linear infinite}
  .phrase{opacity:0;animation:rot 12s infinite}
  .caret{animation:blink 1s steps(1) infinite}
  .iris{animation:look 6s ease-in-out infinite;transform-origin:1110px 165px}
  .lid{animation:lid 6s ease-in-out infinite;transform-origin:1110px 165px}
  @keyframes flow{to{stroke-dashoffset:0}}
  @keyframes beat{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
  @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(320px)}}
  @keyframes rot{0%,2%{opacity:0}5%,22%{opacity:1}25%,100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes look{0%,20%{transform:translateX(0)}30%,45%{transform:translateX(-7px)}55%,75%{transform:translateX(6px)}85%,100%{transform:translateX(0)}}
  @keyframes lid{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
</style>
